<svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="20" cy="20" r="20" fill="#07090e"/>

  <!-- Outer decorative ring -->
  <circle cx="20" cy="20" r="18.5" stroke="#e8a84c" stroke-width="0.6" opacity="0.25"/>

  <!-- Compass ticks -->
  <line x1="20" y1="1" x2="20" y2="4.5"   stroke="#e8a84c" stroke-width="0.8" opacity="0.4" stroke-linecap="round"/>
  <line x1="20" y1="35.5" x2="20" y2="39" stroke="#e8a84c" stroke-width="0.8" opacity="0.4" stroke-linecap="round"/>
  <line x1="1" y1="20" x2="4.5" y2="20"   stroke="#e8a84c" stroke-width="0.8" opacity="0.4" stroke-linecap="round"/>
  <line x1="35.5" y1="20" x2="39" y2="20" stroke="#e8a84c" stroke-width="0.8" opacity="0.4" stroke-linecap="round"/>

  <!-- Diamond envelope -->
  <path d="M20 6 L34 20 L20 34 L6 20 Z" stroke="#e8a84c" stroke-width="1.15" fill="none" opacity="0.75"/>

  <!-- Envelope flap -->
  <path d="M6 20 L20 13.5 L34 20" stroke="#e8a84c" stroke-width="0.9" fill="none" opacity="0.45"/>

  <!-- Lock body -->
  <rect x="15.2" y="21.5" width="9.6" height="7.5" rx="1.4" stroke="#e8a84c" stroke-width="1.1" fill="none"/>

  <!-- Lock shackle -->
  <path d="M17.2 21.5 L17.2 19.5 Q17.2 16.8 20 16.8 Q22.8 16.8 22.8 19.5 L22.8 21.5" stroke="#e8a84c" stroke-width="1.1" fill="none" stroke-linecap="round"/>

  <!-- Lock keyhole -->
  <circle cx="20" cy="25" r="1.2" fill="#e8a84c" opacity="0.8"/>
  <line x1="20" y1="26.2" x2="20" y2="28" stroke="#e8a84c" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
</svg>
